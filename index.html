<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" id="tc" content="#abcae6">
<meta name="apple-mobile-web-app-title" content="사계절">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>사계절 배경화면</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/*
VOICE: soft pastel anime background, calm and bright
IDEA: the user's own waterfall painting, repainted for each season
PICTURE: full-bleed painting; moving water, mist and drifting petals, leaves or snow layered on top
COLOUR and TYPE: the painting's own pastel palette per season; Gowun Dodum
LAYOUT: edge-to-edge picture, clock top-centre over the sky, quiet pill controls that fade away
*/
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none;background:#cfe3f6;font-family:"Gowun Dodum",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.scene{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100lvh;overflow:hidden}
.scene img{position:absolute;left:0;top:0;transform-origin:0 0;image-rendering:auto;opacity:0;transition:opacity 1.8s ease;will-change:opacity;pointer-events:none}
.scene img.on{opacity:1}
canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100lvh;display:block;pointer-events:none}
#probe{position:fixed;left:0;top:0;width:100vw;height:100vh;height:calc(100lvh + env(safe-area-inset-bottom));visibility:hidden;pointer-events:none}
.clock{position:fixed;left:50%;transform:translateX(-50%);top:max(4vh,env(safe-area-inset-top) + 12px);text-align:center;color:#fff;text-shadow:0 2px 16px rgba(40,70,120,.35);transition:opacity .6s;pointer-events:none}
.clock b{display:block;font-weight:400;font-size:clamp(56px,11vmin,128px);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.clock span{display:block;font-size:clamp(17px,2.6vmin,26px);margin-top:.45em}
.clock.off{opacity:0}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);padding:14px 30px;border-radius:999px;background:rgba(40,52,80,.28);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;font-size:clamp(22px,3.4vmin,34px);text-shadow:0 1px 8px rgba(0,0,0,.25);opacity:0;transition:opacity .35s,transform .35s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>
<div class="scene" id="scene">
  <img src="spring.jpg" alt="봄 폭포 풍경" data-s="0">
  <img src="summer.jpg" alt="여름 폭포 풍경" data-s="1">
  <img src="autumn.jpg" alt="가을 폭포 풍경" data-s="2">
  <img src="winter.jpg" alt="겨울 폭포 풍경" data-s="3">
</div>
<canvas id="water"></canvas>
<canvas id="catc"></canvas>
<canvas id="fx"></canvas>
<div class="clock" id="clock"><b id="time">--:--</b><span id="date"></span></div>
<div class="toast" id="toast"></div>
<div id="probe"></div>
<script>
{
const IW=1672,IH=941,Y0=-110,IH2=1161;     // painting: original band 0..941, extended from -110 to 1051
const CAT_LEFT=225;                          // keep the cat in view when the sides are cropped
const imgs=[...document.querySelectorAll('#scene img')];
const wc=document.getElementById('water'),fc=document.getElementById('fx');
const wx=wc.getContext('2d'),fxx=fc.getContext('2d');
const cc=document.getElementById('catc'),ctx=cc.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=0,H=0,DPR=1,S=1,OX=0,OY=0,cur=1,auto=true,parts=[],streaks=[],puffs=[],glints=[];

// ---------- fit painting (cover, biased toward the cat) ----------
function layout(){
  const pr=document.getElementById('probe').getBoundingClientRect();
  W=Math.max(innerWidth,Math.round(pr.width),document.documentElement.clientWidth);H=Math.max(innerHeight,Math.round(pr.height),document.documentElement.clientHeight);
  DPR=Math.min(2,window.devicePixelRatio||1);
  for(const c of[wc,cc,fc]){c.style.width=W+'px';c.style.height=H+'px'}document.getElementById('scene').style.height=H+'px';
  S=Math.max(W/IW,H/IH2);
  let left=(IW-W/S)/2;left=Math.max(0,Math.min(left,CAT_LEFT));
  let top=(IH-H/S)/2;top=Math.min(Math.max(Y0,top),Y0+IH2-H/S);
  OX=-left*S;OY=-top*S;
  for(const im of imgs){im.style.width=IW*S+'px';im.style.height=IH2*S+'px';im.style.transform=`translate(${OX}px,${OY+Y0*S}px)`}
  paintRoot();
  for(const c of[wc,cc,fc]){c.width=W*DPR;c.height=H*DPR}
}

// ---------- water motion (in painting coordinates) ----------
const WF={x0:536,x1:1410,top:258,foam:640,bot:738};
function seedWater(){
  streaks=Array.from({length:170},()=>({x:WF.x0+Math.random()*(WF.x1-WF.x0),y:WF.top+Math.random()*(WF.bot-WF.top),len:26+Math.random()*90,sp:2.2+Math.random()*2.6,a:.12+Math.random()*.28,w:.7+Math.random()*1.8}));
  puffs=Array.from({length:26},(_,i)=>({x:WF.x0+30+(WF.x1-WF.x0-60)*(i/25)+(Math.random()-.5)*30,y:WF.foam+30+Math.random()*60,r:26+Math.random()*34,ph:Math.random()*7,sp:.012+Math.random()*.02}));
  glints=Array.from({length:22},()=>({x:WF.x0+Math.random()*(WF.x1-WF.x0),y:WF.top+40+Math.random()*(WF.bot-WF.top-40),ph:Math.random()*7,sp:.02+Math.random()*.03}));
}
const puffImg=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');const gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.5,'rgba(255,255,255,.55)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,128,128);return c})();
const ROCKS=[[712,718,90,40],[858,742,120,36],[1128,736,98,32]];
const WFX0=548,WFX1=1398,WFT=270,WFH=370,TILE=260;
const wfTex=['spring','summer','autumn','winter'].map(n=>{const i=new Image();i.src=`wf_${n}.jpg`;return i});
const wfMask=new Image();wfMask.src='wf_mask.png';
const wfBuf=document.createElement('canvas');wfBuf.width=(WFX1-WFX0)*2;wfBuf.height=WFH*2;const wb=wfBuf.getContext('2d');
let wfOff=0;
function flowLayer(tex,off,alpha){
  const th=TILE*2,bw=wfBuf.width;let y=(off*2)%th-th;
  wb.globalAlpha=alpha;for(;y<wfBuf.height;y+=th)wb.drawImage(tex,0,y,bw,th);wb.globalAlpha=1;
}
function flowingWater(c,dt){
  const tex=wfTex[cur];if(!tex.naturalWidth||!wfMask.naturalWidth)return;
  wfOff+=(cur===3?.35:1.15)*dt;
  wb.globalCompositeOperation='source-over';wb.clearRect(0,0,wfBuf.width,wfBuf.height);
  flowLayer(tex,wfOff,1);flowLayer(tex,wfOff*1.55+97,.38);
  wb.globalCompositeOperation='destination-in';wb.drawImage(wfMask,0,0,wfBuf.width,wfBuf.height);
  wb.globalCompositeOperation='source-over';
  c.drawImage(wfBuf,WFX0,WFT,WFX1-WFX0,WFH);
}

// ---------- lower water: churning splash zone and a flowing pool (rocks stay put) ----------
const FOAM={x0:548,y0:592,x1:1398,y1:750},POOL={x0:690,y0:736,x1:1240,y1:802};
for(const z of[FOAM,POOL]){z.m=new Image();z.buf=document.createElement('canvas');z.buf.width=(z.x1-z.x0)*2;z.buf.height=(z.y1-z.y0)*2;z.bc=z.buf.getContext('2d')}
FOAM.m.src='foam_mask.png';POOL.m.src='pool_mask.png';
const flows=Array.from({length:46},(_,i)=>({lane:Math.random(),u:Math.random(),sp:.18+Math.random()*.25,len:10+Math.random()*16,ph:Math.random()*7,side:i%2?1:-1}));
function stripCopy(z,im,k,dxf,dyf,alpha){
  const c=z.bc,ww=z.x1-z.x0,ST=3;c.globalAlpha=alpha;
  for(let y=z.y0;y<z.y1;y+=ST){const dx=dxf(y),dy=dyf(y);
    c.drawImage(im,z.x0*k,(y-Y0)*k,ww*k,(ST+1)*k,dx*2,(y-z.y0+dy)*2,ww*2,(ST+1)*2)}
  c.globalAlpha=1;
}
function lowerWater(c,t){
  const im=imgs[cur];if(!im.complete||!im.naturalWidth)return;const k=im.naturalWidth/IW,win=cur===3,sp=win?.35:1;
  // splash zone: two wobbling copies of the foam, so the billows churn
  if(FOAM.m.naturalWidth){const z=FOAM,b=z.bc;b.globalCompositeOperation='source-over';b.clearRect(0,0,z.buf.width,z.buf.height);
    stripCopy(z,im,k,y=>3.2*Math.sin(y*.085+t*.05*sp),y=>-1.6*(1+Math.sin(y*.05-t*.04*sp)),1);
    stripCopy(z,im,k,y=>-3.6*Math.sin(y*.06-t*.043*sp+1.7),y=>-2.4*(1+Math.sin(y*.07+t*.035*sp)),.55);
    b.globalCompositeOperation='destination-in';b.drawImage(z.m,0,0,z.buf.width,z.buf.height);b.globalCompositeOperation='source-over';
    c.drawImage(z.buf,z.x0,z.y0,z.x1-z.x0,z.y1-z.y0)}
  // pool: rippling surface with highlights drifting away from the falls
  if(POOL.m.naturalWidth){const z=POOL,b=z.bc,ww=z.x1-z.x0,hh=z.y1-z.y0;b.globalCompositeOperation='source-over';b.clearRect(0,0,z.buf.width,z.buf.height);
    stripCopy(z,im,k,y=>(win?.6:2.6)*Math.sin(y*.32+t*.09*sp),y=>0,1);
    if(!win){b.save();b.scale(2,2);b.lineCap='round';
      for(const f of flows){f.u=(f.u+f.sp*.0016*sp*(1+f.lane))%1;
        const y=4+f.lane*(hh-8),cx=ww*.5+f.side*f.u*ww*.55,a=Math.sin(Math.PI*f.u)*(.5+.3*Math.sin(t*.05+f.ph));
        const L=f.len*(.6+f.lane*.7);b.strokeStyle=`rgba(255,255,255,${a})`;b.lineWidth=1+f.lane*.8;
        b.beginPath();b.moveTo(cx-L/2,y);b.quadraticCurveTo(cx,y-1.6,cx+L/2,y);b.stroke()}
      b.restore()}
    b.globalCompositeOperation='destination-in';b.drawImage(z.m,0,0,z.buf.width,z.buf.height);b.globalCompositeOperation='source-over';
    c.drawImage(z.buf,z.x0,z.y0,ww,hh)}
}

function water(t,dt){
  const c=wx;c.setTransform(DPR,0,0,DPR,0,0);c.clearRect(0,0,W,H);
  c.setTransform(S*DPR,0,0,S*DPR,OX*DPR,OY*DPR);
  const win=cur===3,k=win?.45:1;
  flowingWater(c,dt);
  lowerWater(c,t);
  drawTrees(c,performance.now());
  c.save();c.beginPath();c.rect(WF.x0,WF.top,WF.x1-WF.x0,WF.bot-WF.top);c.clip();
  c.lineCap='round';
  for(const s of streaks){
    s.y+=s.sp*k*dt;if(s.y-s.len>WF.bot){s.y=WF.top-Math.random()*40;s.x=WF.x0+Math.random()*(WF.x1-WF.x0)}
    const y0=Math.max(WF.top,s.y-s.len),y1=Math.min(WF.bot,s.y);if(y1<=y0)continue;
    const fadeTop=Math.min(1,(s.y-WF.top)/60);
    c.strokeStyle=`rgba(255,255,255,${s.a*(win?.6:1)*fadeTop})`;c.lineWidth=s.w;c.beginPath();c.moveTo(s.x,y0);c.lineTo(s.x,y1);c.stroke();
  }
  c.restore();
  // foam and rising mist
  for(const p of puffs){
    const pulse=.5+.5*Math.sin(t*p.sp+p.ph),r=p.r*(.85+.3*pulse);
    c.globalAlpha=(win?.18:.32)*(.6+.4*pulse);c.drawImage(puffImg,p.x-r,p.y-r-pulse*6,r*2,r*2);
  }
  for(let i=0;i<6;i++){const f=((t*.0016)+i/6)%1,x=WF.x0+(WF.x1-WF.x0)*((i*.37+.12)%1),y=WF.bot-20-f*170,r=60+f*90;c.globalAlpha=(1-f)*(win?.14:.22);c.drawImage(puffImg,x-r,y-r,r*2,r*2)}
  c.globalAlpha=1;
  // glints
  c.fillStyle='#fff';
  for(const g of glints){const a=Math.sin(t*g.sp+g.ph);if(a<.55)continue;const r=(a-.55)*9;c.globalAlpha=a;
    c.beginPath();c.moveTo(g.x,g.y-r*2);c.lineTo(g.x+r*.35,g.y);c.lineTo(g.x,g.y+r*2);c.lineTo(g.x-r*.35,g.y);c.closePath();c.fill();
    c.beginPath();c.moveTo(g.x-r*2,g.y);c.lineTo(g.x,g.y+r*.35);c.lineTo(g.x+r*2,g.y);c.lineTo(g.x,g.y-r*.35);c.closePath();c.fill()}
  c.globalAlpha=1;
}

// ---------- falling petals / leaves / maples / snow (screen coordinates) ----------
const PAL=[
  [['#f7c3d4','#d98aa8'],['#fbd9e4','#e7a4bd'],['#f3b1c8','#cf7c9d']],
  [['#a6cf86','#5f9a55'],['#c4e19b','#76ad5f'],['#86bd72','#4d8a4a']],
  [['#de5a2c','#8f2f18'],['#f09a38','#a5581e'],['#f5bf48','#a97b1d'],['#c9452c','#7c2516']],
  [['#ffffff','#c9d6ee']]
];
function spawn(top){
  const s=cur,z=.45+Math.random()*.85,u=Math.min(W,H)/900;
  const [fill,edge]=PAL[s][(Math.random()*PAL[s].length)|0];
  return{s,z,a:1,fill,edge,x:Math.random()*W*1.2-W*.1,y:top?-30-Math.random()*H*.25:Math.random()*H,
    size:(s===3?3.2:s===2?13:s===1?11:8)*u*z*(.75+Math.random()*.5),
    vy:(s===3?.55:s===2?.95:s===1?.85:.6)*z*(.8+Math.random()*.5)*Math.max(1,u),
    rot:Math.random()*7,vr:(Math.random()-.5)*.05,ph:Math.random()*7,flip:Math.random()*7};
}
function target(){return Math.round(W*H/(cur===3?6500:cur===0?11000:15000)*(reduce?.3:1))}
const MAPLE=[[0,-1],[.12,-.55],[.38,-.72],[.3,-.35],[.92,-.42],[.62,-.08],[.78,.12],[.32,.1],[.38,.42],[.08,.25],[0,.32]];
function drawP(c,p){
  c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.globalAlpha=(.6+p.z*.4)*p.a;
  const k=p.size;
  if(p.s===3){c.fillStyle='rgba(190,205,235,.55)';c.beginPath();c.arc(k*.25,k*.3,k,0,7);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(0,0,k,0,7);c.fill()}
  else{
    c.scale(1,Math.cos(p.flip)*.75+.25);c.fillStyle=p.fill;c.strokeStyle=p.edge;c.lineWidth=Math.max(.6,k*.07);c.lineJoin='round';c.beginPath();
    if(p.s===0){c.moveTo(0,-k);c.bezierCurveTo(k*.75,-k*.7,k*.7,k*.5,0,k);c.bezierCurveTo(-k*.7,k*.5,-k*.75,-k*.7,0,-k);c.closePath();c.fill();c.stroke();
      c.fillStyle='rgba(255,255,255,.5)';c.beginPath();c.ellipse(-k*.18,-k*.15,k*.18,k*.42,0,0,7);c.fill()}
    else if(p.s===1){c.moveTo(0,-k);c.bezierCurveTo(k*.6,-k*.5,k*.5,k*.5,0,k);c.bezierCurveTo(-k*.5,k*.5,-k*.6,-k*.5,0,-k);c.closePath();c.fill();c.stroke();
      c.beginPath();c.moveTo(0,-k*.8);c.lineTo(0,k*1.15);c.stroke()}
    else{MAPLE.forEach(([x,y],i)=>i?c.lineTo(x*k,y*k):c.moveTo(x*k,y*k));for(let i=MAPLE.length-2;i>=1;i--)c.lineTo(-MAPLE[i][0]*k,MAPLE[i][1]*k);c.closePath();c.fill();c.stroke();
      c.beginPath();c.moveTo(0,k*.3);c.lineTo(0,k*.8);c.stroke()}
  }
  c.restore();
}


// ---------- the cat: sits as painted; tap to stand, stretch, walk down the rocks and back ----------
const NAMES=['spring','summer','autumn','winter'];
const loadImg=src=>{const i=new Image();i.src=src;return i};
const spr=NAMES.map(n=>({b:loadImg(`cat_${n}_body.png`),t:loadImg(`cat_${n}_tail.png`),h:loadImg(`cat_${n}_head.png`)}));
const SB=[238,493,422,662],HB=[270,492,424,604],TP=[283,640],HOME=[334,648],HA=[345,597];
const CC=[{fur:'#fdf0eb',far:'#e9d7d8',patch:'#ebb9a1',line:'#7d6b64'},
          {fur:'#faf0ea',far:'#e6d6d5',patch:'#e3b59b',line:'#7a6660'},
          {fur:'#fff2df',far:'#eedac4',patch:'#f1b68e',line:'#7f6650'},
          {fur:'#f6f3f8',far:'#ddd8e5',patch:'#ddbfb5',line:'#6f6b78'}];
const OFF_W=300,OFF_H=260,OX0=150,OY0=230;
const off=document.createElement('canvas');off.width=OFF_W*2;off.height=OFF_H*2;const oc=off.getContext('2d');
const SPEED=46,STRIDE=17;
const sm=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)};
const ease=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
const groundY=x=>x<520?648+Math.max(0,x-380)*.02:(x<720?717:816);
const persp=y=>1+Math.min(1,Math.max(0,(y-650)/170))*.15;

// ---- plan: stand up, stretch, walk right, hop down twice, rest on the plaza, come back ----
function makePlan(mode){
  const segs=[];let t=0,x=HOME[0]-19,y=HOME[1];
  const push=s=>{s.t0=t;t+=s.dur;segs.push(s)};
  const walk=(tx,d)=>{const ty=groundY(tx),dist=Math.abs(tx-x);push({k:'walk',x0:x,y0:y,x1:tx,y1:ty,dir:d,dur:dist/SPEED});x=tx;y=ty};
  const hop=(tx,ty,d)=>{push({k:'hop',x0:x,y0:y,x1:tx,y1:ty,dir:d,dur:.74});x=tx;y=ty};
  push({k:'up',x,y,dir:1,sitX:HOME[0],dur:.62});
  push({k:'stretch',x,y,dir:1,dur:1.15});
  if(mode==='stretch'){push({k:'down',x,y,dir:1,sitX:HOME[0],dur:.62});return{segs,dur:t}}
  const go=(tx,ty,d)=>{const dist=Math.hypot(tx-x,(ty-y)*1.6);push({k:'walk',x0:x,y0:y,x1:tx,y1:ty,dir:d,dur:dist/SPEED});x=tx;y=ty};
  const sit=(d,dur)=>{const sx=d>0?x+19:x-41;push({k:'down',x,y,dir:d,sitX:sx,dur:.62});push({k:'rest',x,y,dir:d,sitX:sx,dur});return sx};
  const stand=(sx,d)=>{x=d>0?sx-19:sx+41;push({k:'up',x,y,dir:d,sitX:sx,dur:.62})};
  if(mode==='small'){walk(468,1);const s1=sit(1,2.6);stand(s1,-1);walk(HOME[0]+41,-1);push({k:'down',x,y:HOME[1],dir:-1,sitX:HOME[0],dur:.62});return{segs,dur:t}}
  walk(468,1);hop(588,716,1);walk(660,1);hop(748,812,1);
  go(930,868,1);go(1130,892,1);go(1330,846,1);
  let sx=sit(1,3.6);stand(sx,-1);
  go(1180,812,-1);go(980,846,-1);
  sx=sit(-1,2.4);stand(sx,1);
  go(1060,900,1);push({k:'stretch',x,y,dir:1,dur:.9});
  go(880,888,-1);go(790,816,-1);
  hop(662,717,-1);walk(602,-1);hop(470,650,-1);walk(HOME[0]+41,-1);
  push({k:'down',x,y:HOME[1],dir:-1,sitX:HOME[0],dur:.62});
  return{segs,dur:t};
}
let PLAN=makePlan('full');
let planT0=-1,hearts=[],catPrev=-1,catFade0=0,catBox=[0,0,0,0];

function poseAt(e,t){
  // returns {sit:{x,y,sc,sq}|null, sitA, stand:{...}|null, standA}
  const idle={sit:{x:HOME[0],y:HOME[1],sc:1,sq:0},sitA:1,stand:null,standA:0};
  if(e<0||e>=PLAN.dur)return idle;
  const s=PLAN.segs.find(g=>e>=g.t0&&e<g.t0+g.dur);if(!s)return idle;
  const u=(e-s.t0)/s.dur;
  const st=(x,y,dir,extra)=>Object.assign({x,y,dir,sc:persp(y),walk:0,phase:0,crouch:0,stretch:0,air:0,lift:0,bob:0},extra||{});
  if(s.k==='up'){const sq=-Math.sin(Math.PI*Math.min(1,u/.35))*.045;
    return{sit:{x:s.sitX,y:s.y,sc:persp(s.y),sq},sitA:1-sm(.33,.52,u),stand:st(s.x,s.y,s.dir,{crouch:1-sm(.4,1,u)}),standA:sm(.3,.48,u)}}
  if(s.k==='down'){const sq=u>.75?Math.sin(Math.PI*(u-.75)/.25)*.03:0;

function wingPath(c,len,f,root,back){
  // swept wing: shoulder -> wrist -> long tip pointing back, feathered trailing edge to the body
  const{lift,ty,tx}=wingGeom(len,f,root,back);
  c.beginPath();c.moveTo(root+1.5,-1.2);
  c.bezierCurveTo(root-len*.05,ty*1.08,tx+len*.45,ty-1,tx,ty+len*.05*lift);
  const n=5;let px=tx,py=ty+len*.05*lift;
  for(let i=1;i<=n;i++){const u=i/n,qx=tx+(back-tx)*u,qy=py+(-.8-py)*(i===n?1:u*.9)+0;
    const yy=(ty+len*.05*lift)+(-.8-(ty+len*.05*lift))*Math.pow(u,1.1);
    c.quadraticCurveTo((px+qx)/2,(py+yy)/2+(lift>0?1:-1)*len*.06,qx,yy);px=qx;py=yy}
  c.closePath();
}
function wingEdge(c,len,f,root,back,col,w){
  const{lift,ty,tx}=wingGeom(len,f,root,back);
  c.save();c.strokeStyle=col;c.lineWidth=w;c.beginPath();let px=tx,py=ty+len*.05*lift;c.moveTo(px,py);
  for(let i=1;i<=5;i++){const u=i/5,qx=tx+(back-tx)*u,yy=(ty+len*.05*lift)+(-.8-(ty+len*.05*lift))*Math.pow(u,1.1);
    c.quadraticCurveTo((px+qx)/2,(py+yy)/2+(lift>0?1:-1)*len*.06,qx,yy);px=qx;py=yy}
  c.stroke();c.restore();
}
function drawBird(c,b,t){
  const B=BIRD[b.k],f=Math.sin(b.ph),line='rgba(70,60,75,.75)';
  c.save();c.translate(b.x,b.y);c.scale(b.dir*b.sc,b.sc);c.lineJoin='round';c.lineCap='round';c.lineWidth=.8;c.strokeStyle=line;
  const glide=B.name==='swallow'&&Math.sin(b.t*.9+b.sw)>.55?.45:1;
  const fl=f*glide;
  if(B.name==='swallow'){
    c.fillStyle='#1d2b52';wingPath(c,15,-fl*.8,3,-6);c.fill();
    c.beginPath();c.moveTo(-8,0);c.lineTo(-20,-3.5);c.lineTo(-13,0);c.lineTo(-20,3);c.closePath();c.fill();c.stroke();
    c.beginPath();c.ellipse(0,0,10,3.6,0,0,7);c.fill();c.stroke();
    c.fillStyle='#fffaf5';c.beginPath();c.ellipse(1,1.6,7,2,0,0,7);c.fill();
    c.fillStyle='#24345f';c.beginPath();c.arc(9,-.6,3.3,0,7);c.fill();c.stroke();
    c.fillStyle='#e0715f';c.beginPath();c.arc(11,.9,1.5,0,7);c.fill();
    c.fillStyle='#333';c.beginPath();c.moveTo(12,-.6);c.lineTo(15,0);c.lineTo(12,.6);c.fill();
    c.fillStyle='#33467a';wingPath(c,17,fl,3,-6);c.fill();c.stroke();
  }else if(B.name==='kingfisher'){
    c.fillStyle='#2b78b8';wingPath(c,12,-fl*.8,3,-5);c.fill();
    c.fillStyle='#2e86c9';c.beginPath();c.moveTo(-7,0);c.lineTo(-13,-1.5);c.lineTo(-13,1.8);c.closePath();c.fill();c.stroke();
    c.beginPath();c.ellipse(0,0,8.5,4.2,0,0,7);c.fill();c.stroke();
    c.fillStyle='#f29a4a';c.beginPath();c.ellipse(1,1.9,6.2,2.2,0,0,7);c.fill();
    c.fillStyle='#2e86c9';c.beginPath();c.arc(7.5,-1.4,4,0,7);c.fill();c.stroke();
    c.fillStyle='#f29a4a';c.beginPath();c.ellipse(8,.4,2.2,1.2,0,0,7);c.fill();
    c.fillStyle='#fff';c.beginPath();c.arc(8.6,-2,1.1,0,7);c.fill();c.fillStyle='#222';c.beginPath();c.arc(8.9,-2,.6,0,7);c.fill();
    c.fillStyle='#2b2b30';c.beginPath();c.moveTo(11,-2);c.lineTo(17.5,-.6);c.lineTo(11,0);c.fill();
    c.fillStyle='#5fb3e6';wingPath(c,13,fl,3,-5);c.fill();wingEdge(c,13,fl,3,-5,'#2a6fa8',1.6);c.stroke();
  }else if(B.name==='goose'){
    c.fillStyle='#857a70';wingPath(c,19,-fl*.8,5,-12);c.fill();
    c.fillStyle='#9a8f84';c.beginPath();c.ellipse(-1,0,11,4.3,0,0,7);c.fill();c.stroke();
    c.fillStyle='#d8d0c4';c.beginPath();c.ellipse(-1,1.9,8,2,0,0,7);c.fill();
    c.strokeStyle='#3f3a36';c.lineWidth=2.6;c.beginPath();c.moveTo(8,-.8);c.lineTo(16,-1.6);c.stroke();
    c.fillStyle='#3f3a36';c.beginPath();c.arc(17,-1.7,2.3,0,7);c.fill();
    c.fillStyle='#fff';c.fillRect(15.4,-.8,2.6,.9);
    c.fillStyle='#e49a46';c.beginPath();c.moveTo(19,-2.3);c.lineTo(22,-1.5);c.lineTo(19,-1);c.fill();
    c.strokeStyle=line;c.lineWidth=.8;c.fillStyle='#a69a8e';wingPath(c,20,fl,5,-12);c.fill();wingEdge(c,20,fl,5,-12,'#6d6259',1.8);c.stroke();
  }else{
    c.fillStyle='#dfe3ec';wingPath(c,25,-fl*.8,6,-15);c.fill();
    c.strokeStyle='#9a9aa6';c.lineWidth=1.1;c.beginPath();c.moveTo(-9,1);c.lineTo(-25,2.2);c.moveTo(-9,2);c.lineTo(-25,3.3);c.stroke();
    c.fillStyle='#2a2a30';c.beginPath();c.moveTo(-10,-1.5);c.quadraticCurveTo(-16,-.5,-17,1.5);c.quadraticCurveTo(-13,2.5,-9,2);c.fill();
    c.strokeStyle=line;c.lineWidth=.8;c.fillStyle='#fbfcff';c.beginPath();c.ellipse(-1,0,12,4.6,-.03,0,7);c.fill();c.stroke();
    c.strokeStyle='#2a2a30';c.lineWidth=2.6;c.beginPath();c.moveTo(9,-1);c.quadraticCurveTo(14,-2.2,19.5,-1.8);c.stroke();
    c.fillStyle='#2a2a30';c.beginPath();c.arc(20.5,-1.8,2.3,0,7);c.fill();
    c.fillStyle='#fbfcff';c.beginPath();c.arc(20.2,-.9,1.3,0,7);c.fill();
    c.fillStyle='#d9363e';c.beginPath();c.arc(21,-3.6,1.2,0,7);c.fill();
    c.fillStyle='#b9a86a';c.beginPath();c.moveTo(22.4,-2.5);c.lineTo(27.5,-1.5);c.lineTo(22.4,-1.1);c.fill();
    c.strokeStyle=line;c.lineWidth=.8;c.fillStyle='#ffffff';wingPath(c,27,fl,6,-15);c.fill();
    wingEdge(c,27,fl,6,-15,'#2a2a30',2.2);c.stroke();
  }
  c.restore();
}
function drawBirds(c,dt){
  c.setTransform(S*DPR,0,0,S*DPR,OX*DPR,OY*DPR);
  birdT-=dt/60;if(birdT<=0&&!birds.some(b=>b.k===cur&&b.x>-60&&b.x<1732)){spawnFlock();const e=BIRD[cur].every;birdT=e[0]+Math.random()*(e[1]-e[0])}
  for(let i=birds.length-1;i>=0;i--){const b=birds[i],B=BIRD[b.k];
    b.t+=dt/60;b.ph+=dt*B.flap;b.x+=b.dir*b.sp*dt;
    const vy=Math.cos(b.t*1.6+b.sw)*B.swoop*.03*dt;b.y+=vy;
    if(b.x<-140||b.x>1812){birds.splice(i,1);continue}
    drawBird(c,b,b.t);
  }
}

let last=performance.now(),t0=0;
function frame(now){
  const dt=Math.min(3,(now-last)/16.67);last=now;t0+=dt;
  water(t0,reduce?0:dt);
  drawCat(now);
  drawBirds(ctx,reduce?0:dt);
  const c=fxx;c.setTransform(DPR,0,0,DPR,0,0);c.clearRect(0,0,W,H);
  const wind=Math.sin(t0*.004)*.6+Math.sin(t0*.0013)*.4,want=target();
  let alive=0;for(const p of parts)if(p.s===cur&&!p.burst)alive++;
  if(alive<want&&Math.random()<.6)parts.push(spawn(true));
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];
    if(p.s!==cur){p.a-=.012*dt;if(p.a<=0){parts.splice(i,1);continue}}
    if(p.burst){p.x+=p.vx*dt;p.vx*=Math.pow(.975,dt);if(p.vy<p.vt)p.vy+=.035*dt}
    p.ph+=.02*dt;p.y+=p.vy*dt;p.x+=(wind*(p.s===3?.4:.9)+Math.sin(p.ph)*.55)*p.z*dt;p.rot+=p.vr*dt;p.flip+=.035*dt;
    if(p.y>H+40||p.x<-80||p.x>W+80){if(p.s===cur&&!p.burst&&alive<=want)Object.assign(p,spawn(true));else parts.splice(i,1)}
    else drawP(c,p);
  }
  requestAnimationFrame(frame);
}

// ---------- controls ----------
const clock=document.getElementById('clock'),toastEl=document.getElementById('toast');
const SNAME=['봄','여름','가을','겨울'];
function monthSeason(){const m=new Date().getMonth()+1;return m>=3&&m<=5?0:m>=6&&m<=8?1:m>=9&&m<=11?2:3}
function paintRoot(){
  const im=imgs[cur],r=document.documentElement.style;if(!im||!S)return;
  r.backgroundImage=`url("${im.getAttribute('src')}")`;r.backgroundRepeat='no-repeat';
  r.backgroundSize=`${IW*S}px ${IH2*S}px`;r.backgroundPosition=`${OX}px ${OY+Y0*S}px`;
}
let rootT;
function setSeason(s){
  if(s!==cur){catPrev=cur;catFade0=performance.now();birdT=Math.min(birdT,1.2)}
  cur=s;imgs.forEach(im=>im.classList.toggle('on',+im.dataset.s===s));
  const bot=['#8f99a7','#8696a6','#9a8b81','#bac5db'][s];document.documentElement.style.backgroundColor=bot;document.getElementById('tc').setAttribute('content',['#aacdfe','#a0c9fa','#abcae6','#bdcde7'][s]);document.body.style.background='transparent';
  clearTimeout(rootT);rootT=setTimeout(paintRoot,1900);
}
function save(){try{localStorage.setItem('seasonwp2',JSON.stringify({auto,cur,clock:!clock.classList.contains('off')}))}catch(_){}}
let toastT;function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('show'),1100)}
// gestures: swipe left/right = next/previous season, swipe up/down = clock on/off,
// tap = cat or tree, double-tap on empty scenery = back to automatic (calendar) season
let g=null,lastTap=0;
document.addEventListener('pointerdown',e=>{g={x:e.clientX,y:e.clientY,t:performance.now(),id:e.pointerId}});
document.addEventListener('pointercancel',()=>{g=null});
document.addEventListener('pointerup',e=>{
  if(!g||e.pointerId!==g.id)return;const dx=e.clientX-g.x,dy=e.clientY-g.y,dt=performance.now()-g.t;g=null;
  const ax=Math.abs(dx),ay=Math.abs(dy),min=Math.max(50,Math.min(innerWidth,innerHeight)*.07);
  if(dt<1500&&ax>min&&ax>ay*1.3){auto=false;setSeason((cur+(dx<0?1:3))%4);toast(SNAME[cur]);save();return}
  if(dt<1500&&ay>min&&ay>ax*1.3){clock.classList.toggle('off');toast(clock.classList.contains('off')?'시계 끔':'시계 켬');save();return}
  if(ax>14||ay>14)return;
  if(hitCat(e.clientX,e.clientY)){catTap();return}
  const ht=hitTree(e.clientX,e.clientY);if(ht){shakeTree(...ht);return}
  const now=performance.now();
  if(now-lastTap<320){lastTap=0;auto=true;setSeason(monthSeason());toast('자동 · '+SNAME[cur]+' · v6');save()}else lastTap=now;
});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
addEventListener('keydown',e=>{if(e.key==='c'||e.key==='C'){catTap();return}
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){auto=false;setSeason((cur+(e.key==='ArrowRight'?1:3))%4);toast(SNAME[cur]);save();return}
  const n={'1':0,'2':1,'3':2,'4':3}[e.key];if(n!=null){auto=false;setSeason(n);save()}});

const days=['일','월','화','수','목','금','토'];
function tick(){const d=new Date();document.getElementById('time').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  document.getElementById('date').textContent=`${d.getMonth()+1}월 ${d.getDate()}일 ${days[d.getDay()]}요일`;
  if(auto&&monthSeason()!==cur)setSeason(monthSeason())}

let st={};try{st=JSON.parse(localStorage.getItem('seasonwp2')||'{}')}catch(_){}
auto=st.auto!==false;
if(st.clock===false)clock.classList.add('off');
layout();seedWater();setSeason(auto?monthSeason():(st.cur??monthSeason()));catPrev=-1;
for(let i=0;i<target();i++)parts.push(spawn(false));
tick();setInterval(tick,10000);
let rt;const relayout=()=>{clearTimeout(rt);rt=setTimeout(layout,120)};addEventListener('resize',relayout);addEventListener('orientationchange',()=>setTimeout(layout,400));addEventListener('pageshow',relayout);setTimeout(layout,600);
requestAnimationFrame(frame);
}
